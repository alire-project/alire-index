name = "espidf_http_server"
version = "0.1.0"
website = "https://github.com/godunko/espidf_http_server"
description = "Ada/ESP-IDF: HTTP Server bindings"
long-description = """
Ada bindings for the ESP-IDF HTTP Server component (`esp_http_server`).

Covers:
- starting and stopping the server;
- registration of URI and error handlers;
- reading request body and URL query parameters;
- sending responses: status, headers, content type, complete and chunked bodies, errors.
"""

authors = ["Vadim Godunko"]
maintainers = ["Vadim Godunko <vgodunko@gmail.com>"]
maintainers-logins = ["godunko"]
licenses = "Apache-2.0 WITH LLVM-exception"
tags = ["a0b", "embedded", "esp", "esp32", "espidf", "http-server"]

[configuration]
generate_ada = false
generate_c = false
generate_gpr = true

[[depends-on]]
a0b_buffers = "^0.1.0"
espidf = "^0.2.0"

[origin]
commit = "7b94e6a89b40fb9ee418ada042fcfb2a2fa90a2f"
url = "git+https://github.com/godunko/espidf_http_server.git"

