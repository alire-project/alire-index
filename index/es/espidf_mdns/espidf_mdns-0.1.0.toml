name = "espidf_mdns"
version = "0.1.0"
website = "https://github.com/godunko/espidf_mdns"
description = "Ada/ESP-IDF: mDNS bindings"
long-description = """
Ada bindings for the mDNS (Multicast DNS) component from Espressif's ESP-Protocols
(`espressif/mdns`).

Covers initialization of the mDNS service and setting of the host name,
so the device is reachable as `<hostname>.local` on the local network.
"""

authors = ["Vadim Godunko"]
maintainers = ["Vadim Godunko <vgodunko@gmail.com>"]
maintainers-logins = ["godunko"]
licenses = "Apache-2.0 WITH LLVM-exception"
tags = ["a0b", "embedded", "esp", "esp32", "espidf", "mdns"]

[configuration]
generate_ada = false
generate_c = false
generate_gpr = true

[[depends-on]]
espidf = "^0.2.0"

[origin]
commit = "f05747c3e865def8290cfba0b90de448158bbcd8"
url = "git+https://github.com/godunko/espidf_mdns.git"

