name = "espidf_netif"
version = "0.1.0"
website = "https://github.com/godunko/espidf_netif"
description = "Ada/ESP-IDF: network interface and sockets bindings"
long-description = """
Ada bindings for the ESP-IDF network interface abstraction (`esp_netif`) and the lwIP sockets API.

Covers:
- initialization of the TCP/IP stack;
- query of interface IP information;
- configuration of DHCP server options (including captive portal URI);
- BSD sockets (`socket`, `bind`, `sendto`, `recvfrom`) with typed address families,
  socket types and protocols.
"""

authors = ["Vadim Godunko"]
maintainers = ["Vadim Godunko <vgodunko@gmail.com>"]
maintainers-logins = ["godunko"]
licenses = "Apache-2.0 WITH LLVM-exception"
tags = ["a0b", "embedded", "esp", "esp32", "espidf", "netif"]

[configuration]
generate_ada = false
generate_c = false
generate_gpr = true

[[depends-on]]
espidf_event = "^0.1.0"

[origin]
commit = "29077b6be0350c407c738a9f4917302f4e86e597"
url = "git+https://github.com/godunko/espidf_netif.git"

