name = "espidfada"
version = "0.3.0"
website = "https://github.com/godunko/espidfada"
description = "ESP-IDF/Ada: base types and shared utilities"
long-description = """
Base library for Ada bindings to the Espressif IoT Development Framework (ESP-IDF).

Provides common definitions and utilities used by the `espidfada_*` bindings crates:
- C-compatible types and ESP-IDF error codes;
- C string handling and conversion between Ada and C strings;
- error checking that raises `ESPIDF_Error` for unsuccessful ESP-IDF calls;
- ESP-IDF build integration for generating bindings constants for the current target and configuration.

Peripheral and service bindings are provided by separate crates.
"""

authors = ["Vadim Godunko"]
maintainers = ["Vadim Godunko <vgodunko@gmail.com>"]
maintainers-logins = ["godunko"]
licenses = "Apache-2.0 WITH LLVM-exception"
tags = ["a0b", "embedded", "esp", "esp32", "espidf"]

[configuration]
generate_ada = false
generate_c = false
generate_gpr = true

[[depends-on]]
a0b_base = "^0.6.0"

[origin]
commit = "4b7631993a24d7592b4bd24e5d9033ac826bf7fa"
url = "git+https://github.com/godunko/espidfada.git"

