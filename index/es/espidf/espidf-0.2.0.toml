name = "espidf"
version = "0.2.0"
website = "https://github.com/godunko/espidf"
description = "Ada/ESP-IDF: common types and utilities for ESP-IDF bindings"
long-description = """
Root crate of the Ada bindings for the Espressif IoT Development Framework (ESP-IDF).

Provides definitions shared by all `espidf_*` binding crates:
- C types used across ESP-IDF APIs (`esp_err_t`, `size_t`, ...);
- conversion of strings between Ada and C;
- conversion of `esp_err_t` error codes into Ada exceptions.
"""

authors = ["Vadim Godunko"]
maintainers = ["Vadim Godunko <vgodunko@gmail.com>"]
maintainers-logins = ["godunko"]
licenses = "Apache-2.0 WITH LLVM-exception"
tags = ["a0b", "embedded", "esp", "esp32", "espidf"]

[configuration]
generate_ada = false
generate_c = false
generate_gpr = true

[configuration.variables]
Build_Environment = { type = "enum", values = ["ada_only", "espidf"], default = "ada_only" }

[[depends-on]]
a0b_base = "^0.5.0"

[origin]
commit = "180c1c28078d5e6ce432c48d9d1f35fe668b6047"
url = "git+https://github.com/godunko/espidf.git"

