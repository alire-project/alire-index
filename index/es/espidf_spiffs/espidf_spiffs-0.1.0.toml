name = "espidf_spiffs"
version = "0.1.0"
website = "https://github.com/godunko/espidf_spiffs"
description = "Ada/ESP-IDF: SPIFFS filesystem bindings"
long-description = """
Ada bindings for the ESP-IDF SPIFFS (SPI Flash File System) component (`spiffs`).

Covers registration of a SPIFFS partition in the ESP-IDF VFS (`esp_vfs_spiffs_register`),
after which its files are accessed through the VFS.
"""

authors = ["Vadim Godunko"]
maintainers = ["Vadim Godunko <vgodunko@gmail.com>"]
maintainers-logins = ["godunko"]
licenses = "Apache-2.0 WITH LLVM-exception"
tags = ["a0b", "embedded", "esp", "esp32", "espidf", "spiffs"]

[configuration]
generate_ada = false
generate_c = false
generate_gpr = true

[[depends-on]]
espidf = "^0.2.0"

[origin]
commit = "1ed8d4d0aa428eddeedf20b75b7d9d9b3f507a73"
url = "git+https://github.com/godunko/espidf_spiffs.git"

