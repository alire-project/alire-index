name				= "adacl_desktop"
description			= "AdaCL desktop: Getopt, strings, calendar, tracing, queues, pointers"
long-description		= """Ada Class Library desktop crate for Ada 2022.

This crate holds the former `adacl` desktop API. Use it for hosted
applications that need command-line handling, wide-character text,
diagnostics, queues, or smart pointers. It depends on the SPARK-proven
`adacl` core.

Features:

- Getopt: command-line argument parser with wide character support
- Strings: utilities for String, Wide_String, and Wide_Wide_String
- Calendar: time and date utilities with wide character support
- Tracing: diagnostic trace utility with wide character support
- Protected Queue: finish, wait, and abort operations
- Smart Pointers:
  - Reference-counted pointers
  - Unique pointers (C++-style)
  - Shared pointers (C++-style)

Source: [SourceForge](https://sourceforge.net/p/adacl/git/ci/master/tree/adacl_desktop/src/)
Documentation: [GNATdoc](https://adacl.sourceforge.net/gnatdoc/adacl_desktop/index.html)
"""
notes				= """New crate in 8.0.0: this is the former `adacl` desktop API.

Replace:

    [[depends-on]]
    adacl = "^7.2"

with:

    [[depends-on]]
    adacl_desktop = "^8.0"

`adacl` remains in the tree as the shared SPARK gold core; do not drop it
from the solution, only from direct application dependencies that expected
Getopt, Strings, Calendar, Tracing, queues, or smart pointers.
"""
version				= "8.0.0"
licenses			= "GPL-3.0-or-later"
authors				= ["Martin Krischik <krischik@users.sourceforge.net>"]
maintainers			= ["Martin Krischik <krischik@users.sourceforge.net>"]
maintainers-logins		= ["krischik"]
website				= "https://adacl.sourceforge.net/"
tags				= ["library", "command-line", "trace", "logging", "string", "container", "smart-pointer", "ada2022"]

[build-switches]
"*".ada_version			= "Ada2022"
"*".source_encoding		= "UTF_8"
development.compile_checks	= "Warnings"
development.contracts		= "Yes"
development.debug_info		= "Yes"
development.optimization	= "Debug"
development.runtime_checks	= "Overflow"
release.compile_checks		= "Warnings"
release.contracts		= "No"
release.debug_info		= "No"
release.optimization		= "Performance"
release.runtime_checks		= "Default"
validation.compile_checks	= "Warnings"
validation.contracts		= "Yes"
validation.debug_info		= "Yes"
validation.optimization		= "Debug"
validation.runtime_checks	= "Everything"

[[depends-on]]
adacl				= "^8.0"

[[actions]]
[actions.'case(os)'.linux]
type				= "test"
command				= ["/bin/bash", "ci-verify.sh"]
directory			= "."
[actions.'case(os)'.macos]
type				= "test"
command				= ["/bin/bash", "ci-verify.sh"]
directory			= "."
[actions.'case(os)'.windows]	
type				= "test"
command				= ["powershell", "-ExecutionPolicy", "Bypass", "-File",  "ci-verify.ps1"]
directory			= "."
[actions.'case(os)'.'...']

