name				= "adacl_eastrings"
description			= "AdaCL desktop: Encoding-aware string utilities and text I/O"
long-description		= """Encoding-aware string utilities for Ada 2022, developed by BjÃ¶rn Persson for robust
internationalization (i18n).

Supports text processing with the following encodings:
- Universal Character Set 4, Big-Endian (UCS-4 BE)
- Universal Character Set 4, Little-Endian (UCS-4 LE)
- Universal Character Set 2, Big-Endian (UCS-2 BE)
- Universal Character Set 2, Little-Endian (UCS-2 LE)
- Unicode Transformation Format 16, Big-Endian (UTF-16 BE)
- Unicode Transformation Format 16, Little-Endian (UTF-16 LE)
- Unicode Transformation Format 8 (UTF-8)
- American Standard Code for Information Interchange (ASCII)
- ISO/IEC 8859-1 (Latin-1)
- Code Page 850 (DOS Latin-1)
- Windows Code Page 1252

Additional features:
- Text I/O for encoding-aware input/output
- Basic command-line parsing for internationalized text

Licensed under GPL-3.0-or-later. Integrates with the Ada Class Library (AdaCL).

Source: [SourceForge](https://sourceforge.net/p/adacl/git/ci/master/tree/adacl_eastrings/)
Documentation:	[Overview](https://adacl.sourceforge.net/adacl-eastrings/) and
[GNATdoc](https://adacl.sourceforge.net/gnatdoc/index.html)
"""
notes				= """
# Version 8.2.2:

* Change AdaCL.Serial_IO to propper tagged type to enable inheritance
* Cleanup test and prove to be more reliable on github

# Version 8.2.1:

* Cleanup build to be more reliable on github

# Version 8.2.0:

* Updated AdaCL.Trace for better wide-string support
* Added a new line-insert filter to AdaCL.SAR that can insert multiple lines and/or only at the first matched location
* AdaCL.Serial now generates the macOS serial communication layer on the fly
"""
version				= "8.2.2"
licenses			= "GPL-3.0-or-later"
authors				= ["Martin Krischik <krischik@users.sourceforge.net>" ,"BjÃ¶rn Persson <rombobeorn@users.sourceforge.net>"]
maintainers			= ["Martin Krischik <krischik@users.sourceforge.net>" ,"BjÃ¶rn Persson <rombobeorn@users.sourceforge.net>"]
maintainers-logins		= ["krischik", "rombobeorn"]
website				= "https://sourceforge.net/projects/adacl/"
tags				= ["library", "strings", "i18n", "ada2022"]

[build-switches]
"*".ada_version			= "Ada2022"
"*".source_encoding		= "UTF_8"
development.compile_checks	= "Warnings"
development.contracts		= "Yes"
development.debug_info		= "Yes"
development.optimization	= "Debug"
development.runtime_checks	= "Overflow"
release.compile_checks		= "Warnings"
release.contracts		= "No"
release.debug_info		= "No"
release.optimization		= "Performance"
release.runtime_checks		= "Default"
validation.compile_checks	= "Warnings"
validation.contracts		= "Yes"
validation.debug_info		= "Yes"
validation.optimization		= "Debug"
validation.runtime_checks	= "Everything"

[[depends-on]]
adacl_desktop			= "^8.2"

[[actions]]
[actions.'case(os)'.linux]
type				= "test"
command				= ["/bin/bash", "ci-verify.sh"]
directory			= "."
[actions.'case(os)'.macos]
type				= "test"
command				= ["/bin/bash", "ci-verify.sh"]
directory			= "."
[actions.'case(os)'.windows]
type				= "test"
command				= ["powershell", "-ExecutionPolicy", "Bypass", "-File",  "ci-verify.ps1"]
directory			= "."
[actions.'case(os)'.'...']

