name				= "adacl_sar"
description			= "AdaCL desktop: Search and replace with wide and wide-wide text"
long-description		= """Powerful search-and-replace library for Ada 2022, developed by Martin Krischik, with
wide and wide-wide character support.

Features:
- Load, transform, and store text
- Vector-based text transformations for efficient processing
- Supports standard, wide, and wide-wide characters for internationalisation
- Embedded transformations for internal text processing
- Extensible transformations via tagged types for complex operations
- Integrates with the Ada Class Library (AdaCL) for robust text handling

Licensed under GPL-3.0-or-later. Integrates with the Ada Class Library (AdaCL).

Source: [SourceForge](https://sourceforge.net/p/adacl/git/ci/master/tree/adacl_sar/)
Documentation:	[Overview](https://adacl.sourceforge.net/adacl-sar/) and
[GNATdoc](https://adacl.sourceforge.net/gnatdoc/index.html)
"""
notes				= """
# Version 8.2.0:
* Updated AdaCL.Trace for better wide-string support
* Added a new line-insert filter to AdaCL.SAR that can insert multiple lines and/or only at the first matched location
* AdaCL.Serial now generates the macOS serial communication layer on the fly
"""
version				= "8.2.1"
licenses			= "GPL-3.0-or-later"
authors				= ["Martin Krischik <krischik@users.sourceforge.net>"]
maintainers			= ["Martin Krischik <krischik@users.sourceforge.net>"]
maintainers-logins		= ["krischik"]
website				= "https://sourceforge.net/projects/adacl/"
tags				= ["library", "strings", "search", "replace", "ada2022"]

[build-switches]
"*".ada_version			= "Ada2022"
"*".source_encoding		= "UTF_8"
development.compile_checks	= "Warnings"
development.contracts		= "Yes"
development.debug_info		= "Yes"
development.optimization	= "Debug"
development.runtime_checks	= "Overflow"
release.compile_checks		= "Warnings"
release.contracts		= "No"
release.debug_info		= "No"
release.optimization		= "Performance"
release.runtime_checks		= "Default"
validation.compile_checks	= "Warnings"
validation.contracts		= "Yes"
validation.debug_info		= "Yes"
validation.optimization		= "Debug"
validation.runtime_checks	= "Everything"

[[depends-on]]
adacl_desktop			= "^8.2"

[[actions]]
type				= "test"
command				= ["alr", "--chdir=test", "run"]
directory			= "."

