description = "Simple Components - A collection of support packages"
name = "simple_components"
version = "4.81.0"
website = "http://www.dmitry-kazakov.de/ada/components.htm"
authors = ["Dmitry A. Kazakov"]
licenses = "GPL-2.0-only WITH GCC-exception-2.0"
maintainers = ["alejandro@mosteo.com", "blady.net@orange.fr"]
maintainers-logins = ["mosteo", "Blady-Com"]
tags = ["collection"]
project-files = ["components-ada.gpr", "components-connections_server-elv_max_cube.gpr", "components-connections_server-http_server-sqlite_browser.gpr", "components-connections_server-http_server.gpr", "components-connections_server-ldap.gpr", "components-connections_server-modbus.gpr", "components-connections_server-mqtt.gpr", "components-connections_server-openssl.gpr", "components-connections_server-secure.gpr", "components-connections_server-smtp.gpr", "components-connections_server.gpr", "components-gnutls.gpr", "components-json.gpr", "components-julia.gpr", "components-ntp.gpr", "components-odbc.gpr", "components-openssl.gpr", "components-python.gpr", "components-sqlite.gpr", "components.gpr", "strings_edit.gpr", "tables.gpr"]

[[depends-on]]
libgnutls = "^3.7"
unixODBC = "^2.3"

[gpr-externals]
Development = ["Debug", "Release", "Profile"] # Default Debug
Driver = ["MySQL", "PostgreSQL", "SyBase", "CT_Lib"] # Default MySQL
Legacy = ["Ada95", "Ada2005", "Ada2012"] # Default Ada2012
Target_OS = ["Windows", "Windows_NT", "Linux", "UNIX", "OSX", "FreeBSD", "auto"] # Default Windows
Tasking = ["Multiple", "Single"] # Default Multiple
Traced_Objects = ["Off", "On"] # Default Off

[gpr-set-externals]
Target_OS = "auto"
arch = "auto"
odbc = "auto"
Object_Dir = "nested"

[origin]
commit = "e2238410b26f02112bb053f1ac07fb8524cc9542"
url = "git+https://github.com/Blady-Com/dak_simple_components.git"

