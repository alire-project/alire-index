name = "bbt"
description = "Black box test runner"
version = "0.6.1"

authors = ["Lionel Draghi"]
maintainers = ["Lionel Draghi <lionel.draghi@free.fr>"]
maintainers-logins = ["LionelDraghi"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
website = "https://github.com/LionelDraghi/bbt"
tags = ["test", "testing", "gherkin", "markdown", "tdd", "bdd"]

executables = ["bbt"]

[configuration]
output_dir = "src/Alire_config"
generate_C = false

[[depends-on]]
# markdown = "^24.0.0"

[[depends-on]]
ansiada = "^1.0.0"

[[depends-on]]
# cross-platform process launching and interaction with the commands
# (When I type / When I enter), with a pseudo terminal in raw mode
# allocated to the interactive commands
utilada = "^2.8.0"

[[depends-on]]
# External_Initialization aspect (src/bbt-cmd_line-put_help.adb) requires
# the experimental extensions set : FSF GCC 15 / GNAT Pro 25 or later.
# GNAT FSF 16 is the current toolchain; note that on darwin the linker
# bundled with the GNAT FSF toolchains (15.x and 16.x alike) cannot
# parse the recent SDK .tbd stubs (arm64e.x1 targets): the Xcode 27 CLT
# of the macos-latest GitHub runner image fails every link, in our CI as
# in the alire-index CI, so the CI runs on macos-15 until this is fixed
# upstream
# (cf. https://github.com/alire-project/GNAT-FSF-builds/issues/112).
gnat = ">=16"

[[actions]]
type = "test"
command = ["make"]

[build-profiles]
bbt = "validation"

[[depends-on]]
termicap = "^1.0.0"


[origin]
commit = "8a863a61019bba570fc7d23898511e8e2aa29e52"
url = "git+https://github.com/LionelDraghi/bbt"

