name = "a0b_buffers"
version = "0.2.0"
website = "https://github.com/godunko/a0b-buffers"
description = "A0B: Data Buffers"
long-description = """
Provides memory-safe data buffer abstractions with customizable allocation strategies (fixed and dynamic capacity), optimized for I/O handling and serialization builders.
"""

authors = ["Vadim Godunko"]
maintainers = ["Vadim Godunko <vgodunko@gmail.com>"]
maintainers-logins = ["godunko"]
licenses = "Apache-2.0 WITH LLVM-exception"
tags = ["a0b", "buffers"]

[configuration]
generate_ada = false
generate_c = false
generate_gpr = true

[[depends-on]]
a0b_base = "^0.6.0"

[origin]
commit = "9a0de493a73d200f0f7cbfbe34aa2be1e191aceb"
url = "git+https://github.com/godunko/a0b-buffers.git"

