name: Check Author

on:
  pull_request:
    paths:
      - 'index/**.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check-with-script.yml
    with:
      script: check-author.sh
      script_arg: ${{github.event.pull_request.user.login}}
      setup_alr: true
