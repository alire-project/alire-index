# Please read .github/TESTING and .github/WORKFLOWS.md before modifying this file

# Specific workflow for MacPorts, as we need to disable Brew for this to work
# so it's difficult to use the other standard workflows.

name: Build Crate (MacPorts)
# Build the crate with a native toolchain from Alire

env:
  CHECKS_ORG: alire-project
  CHECKS_REPO: alire-index-checks
  ALR_VERSION: 2.1.1

on:
  pull_request:
    paths:
      - 'index/**.toml'

permissions:
  contents: read

jobs:

  build:
    name: macports / ${{ matrix.os }} # Unique, as a required check name
    env:
      JOB_NAME: ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15-intel  # amd64
          - macos-latest    # arm64

    steps:
    - name: Check out alire-index
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        # Needed to be able to diff and obtain changed files. Furthermore, we
        # need the full history or else grafted partial branches confuse the
        # changed files detectors (in both scripts/gh-build-crate.sh and
        # check-author action).

    - name: Check out alire-index-checks
      uses: actions/checkout@v4
      with:
        repository: ${{env.CHECKS_ORG}}/${{env.CHECKS_REPO}}
        ref: ${{github.base_ref}}
        path: ${{env.CHECKS_REPO}}

    - name: Set up stable `alr`
      uses: alire-project/setup-alire@latest
      with:
        version: ${{env.ALR_VERSION}}

    - name: Disable Homebrew
      run: rm -f $(which brew)
      shell: bash

    - name: Install Ports
      uses: melusina-org/setup-macports@103eded5f10979e927bffcd6d0b86cbbdb2c3bb3 # v1.1.6 (third-party: pinned)

    - name: Prefer Quartz to X11 for MacPorts
      shell: bash
      run: echo '-x11 +no_x11 +quartz' >> /opt/local/etc/macports/variants.conf

    - name: Test crate
      run: ${{env.CHECKS_REPO}}/scripts/gh-build-crate.sh
      shell: bash
      env:
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        # Labeling disabled: the token is read-only on fork PRs (i.e. most
        # submissions), so labels only ever worked for PRs from this repository.
        # Without GITHUB_TOKEN, gh-build-crate.sh logs the label it would apply.
        # GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to apply labels/comment
