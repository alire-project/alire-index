# Please read .github/TESTING and .github/WORKFLOWS.md before modifying this file

# Show differences between the submitted manifest and the previous
# release of the same crate, to enable easier catching of problems, followed
# by what the auto-merge bot would decide for the PR (read-only)

name: Diff release

env:
  CHECKS_ORG: alire-project
  CHECKS_REPO: alire-index-checks
  ALR_VERSION: 2.1.1

on:
  pull_request:
    paths:
      - 'index/**.toml'

permissions:
  contents: read
  # For the auto-merge review: checks, reviews, the timeline, and the run's
  # own check suite, which is left out
  actions: read
  checks: read
  issues: read
  pull-requests: read

jobs:

  DIFF:

    runs-on: ubuntu-latest

    steps:
    - name: Check out alire-index
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        # Needed to be able to diff and obtain changed files. Furthermore, we
        # need the full history or else grafted partial branches confuse the
        # changed files detector

    - name: Check out alire-index-checks
      uses: actions/checkout@v4
      with:
        repository: ${{env.CHECKS_ORG}}/${{env.CHECKS_REPO}}
        ref: ${{github.base_ref}}
        path: ${{env.CHECKS_REPO}}

    - name: Set up stable `alr`
      if: contains(github.base_ref, 'stable-')
      uses: alire-project/setup-alire@latest
      with:
        toolchain: --disable-assistant # We don't need the compiler
        version: ${{env.ALR_VERSION}}

    - name: Set up devel `alr`
      if: contains(github.base_ref, 'devel-')
      uses: alire-project/setup-alire@latest
      with:
        toolchain: --disable-assistant # We don't need the compiler
        branch: master

    - name: Set up Python
      # Same version, Python and requirements as in auto-merge.yml, so that
      # the pip cache it saves on the base branch is restored here
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: ${{env.CHECKS_REPO}}/requirements.txt

    - name: Install Python dependencies
      run: pip install -r "$CHECKS_REPO/requirements.txt"
      shell: bash

    - name: <<DIFF RELEASES>>
      run: ${{env.CHECKS_REPO}}/scripts/diff-release.sh || true # No deal breaker if failed
      shell: bash
      env:
        GH_TOKEN: ${{github.token}}
