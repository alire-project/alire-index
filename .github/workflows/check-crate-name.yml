name: Check Crate Name

on:
  pull_request:
    paths:
      - 'index/**.toml'

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check-with-script.yml
    with:
      name: Crate Name
      script: check-crate-name.sh
      script_arg: unused # The PR title is not needed by the script
