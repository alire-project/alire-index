# Please read .github/TESTING and .github/WORKFLOWS.md before modifying this file

# When the same index version is used by various stable and devel `alr`
# versions, we want to make sure all of them understand the index properly.
# Besides, there are

name: Build Crate (alr dev)
# Build the crate with a native toolchain from Alire

env:
  CHECKS_ORG: alire-project
  CHECKS_REPO: alire-index-checks
  PACMAN: C:\Users\runneradmin\AppData\Local\alire\cache\msys64\usr\bin\pacman

on:
  pull_request:
    paths:
      - 'index/**.toml'

permissions:
  contents: read

jobs:

  build:
    name: alr dev / ${{ matrix.os }} # Unique, as a required check name
    env:
      JOB_NAME: ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15-intel    # amd64
          - macos-15          # arm64
          # Not macos-latest: its macOS 26 SDK lists arm64e.x1 in libSystem.tbd,
          # which the gnat_native 16.1.0 linker rejects ("unknown architecture"),
          # so building alr from master fails at link time. Revert when fixed.
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest

    steps:
    - name: Check out alire-index
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        # Needed to be able to diff and obtain changed files. Furthermore, we
        # need the full history or else grafted partial branches confuse the
        # changed files detectors (in both scripts/gh-build-crate.sh and
        # check-author action).

    - name: Check out alire-index-checks
      uses: actions/checkout@v4
      with:
        repository: ${{env.CHECKS_ORG}}/${{env.CHECKS_REPO}}
        ref: ${{github.base_ref}}
        path: ${{env.CHECKS_REPO}}

    - name: Set up devel `alr`
      uses: alire-project/setup-alire@latest
      with:
        branch: 'master'

    - name: Install tar from msys2 (Windows) # Git tar in Actions VM does not seem to work)
      if: matrix.os == 'windows-latest'
      run: ${{env.PACMAN}} --noconfirm -S tar

    - name: Test crate
      run: ${{env.CHECKS_REPO}}/scripts/gh-build-crate.sh
      shell: bash
      env:
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        # Labeling disabled: the token is read-only on fork PRs (i.e. most
        # submissions), so labels only ever worked for PRs from this repository.
        # Without GITHUB_TOKEN, gh-build-crate.sh logs the label it would apply.
        # GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to apply labels/comment

  # Single result for the whole matrix, so that branch protection requires one
  # stable name instead of one per runner (see .github/WORKFLOWS.md in
  # alire-index). `if: always()` is essential: otherwise this job would be
  # skipped when a matrix job fails, and a skipped required check counts as
  # passed.
  all:
    name: "alr dev / all"
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check that the whole matrix succeeded
      run: '[ "$RESULT" = success ]'
      env:
        RESULT: ${{ needs.build.result }}
